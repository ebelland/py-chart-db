<svg xmlns="http://www.w3.org/2000/svg"
     width="32" height="32" viewBox="0 0 32 32"
     shape-rendering="crispEdges">

    <!-- Axes -->
    <path d="M1 1V31H31"
          stroke="#000000"
          stroke-width="2"
          fill="none"/>

    <!-- Small squares -->
    <rect x="5" y="5"  width="4" height="4" fill="#E74C3C"/>
    <rect x="5" y="13" width="4" height="4" fill="#3498DB"/>
    <rect x="5" y="21" width="4" height="4" fill="#F39C12"/>

    <!-- Gray dotted connections -->
    <line x1="9" y1="7"  x2="13" y2="7"
          stroke="#808080"
          stroke-width="2"
          stroke-dasharray="2 2"/>

    <line x1="9" y1="15" x2="13" y2="15"
          stroke="#808080"
          stroke-width="2"
          stroke-dasharray="2 2"/>

    <!-- Orange square connected directly to large square -->
    <line x1="9" y1="23" x2="14" y2="23"
          stroke="#808080"
          stroke-width="2"
          stroke-dasharray="2 2"/>

    <!-- Large green square -->
    <rect x="14" y="4"
          width="15" height="15"
          fill="#92D050"
          stroke="#000000"
          stroke-width="2"/>

</svg>